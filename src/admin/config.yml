# Opsætning af redigeringsværktøjet (Decap CMS) for RCA's hjemmeside.
backend:
  name: github
  repo: lemmykook-max/rca-website
  branch: main
  commit_messages:
    create: "Opret {{collection}} “{{slug}}”"
    update: "Opdatér {{collection}} “{{slug}}”"
    delete: "Slet {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Slet “{{path}}”"

locale: "da"
site_url: "https://rcfa.dk"
display_url: "https://rcfa.dk"
media_folder: "src/files"
public_folder: "/files"
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "nyheder"
    label: "Nyheder"
    label_singular: "nyhed"
    description: "Nyheder vises på forsiden (de 3 nyeste) og på siden Nyheder."
    folder: "src/nyheder"
    extension: "md"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Overskrift", name: "title", widget: "string" }
      - { label: "Dato", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "D. MMMM YYYY", time_format: false, picker_utc: true }
      - { label: "Kort resumé (vises i oversigten)", name: "summary", widget: "text" }
      - { label: "Tekst", name: "body", widget: "markdown" }

  - name: "sider"
    label: "Tekstsider"
    label_singular: "tekstside"
    description: "Sider med fri tekst, fx referater. Adressen (fx /referat-stiftende-generalforsamling/) skal starte og slutte med /."
    folder: "src/sider"
    extension: "md"
    create: true
    fields:
      - { label: "Overskrift", name: "title", widget: "string" }
      - { label: "Lille overskrift over titlen", name: "eyebrow", widget: "string", required: false }
      - { label: "Indledning", name: "intro", widget: "text", required: false }
      - { label: "Beskrivelse til Google", name: "description", widget: "string", required: false }
      - { label: "Adresse", name: "permalink", widget: "string", hint: "Fx /ny-side/ – må ikke ændres på sider, der allerede er delt" }
      - { label: "Vidensstatus (kun Viden-sider)", name: "status", widget: "select", required: false, options: [{ label: "Udkast – ikke fagligt gennemgået", value: "udkast" }, { label: "Fagligt gennemgået", value: "gennemgaaet" }, { label: "Opdateret efter review", value: "opdateret" }] }
      - { label: "Gennemgået af (navn og rolle)", name: "reviewer", widget: "string", required: false }
      - { label: "Dato for review", name: "review_dato", widget: "string", required: false, hint: "Fx 15. januar 2027" }
      - { label: "PDF til download", name: "pdf", widget: "file", required: false }
      - { label: "Tekst på PDF-knappen", name: "pdf_tekst", widget: "string", required: false }
      - { label: "Tekst", name: "body", widget: "markdown", hint: "Tip: Start et afsnit med > for at vise det som en fremhævet beslutning." }

  - name: "indhold"
    label: "Sider på hjemmesiden"
    editor: { preview: false }
    files:
      - label: "Forside"
        name: "forside"
        file: "src/_data/forside.json"
        fields:
          - { label: "Lille mærkat øverst", name: "tag", widget: "string", required: false }
          - { label: "Overskrift", name: "overskrift", widget: "string" }
          - { label: "Fremhævet ord i overskriften", name: "overskrift_fremhaevet", widget: "string", required: false }
          - { label: "Indledning", name: "intro", widget: "text" }
          - { label: "Knap 1 – tekst", name: "knap1_tekst", widget: "string", required: false }
          - { label: "Knap 1 – link", name: "knap1_link", widget: "string", required: false }
          - { label: "Knap 2 – tekst", name: "knap2_tekst", widget: "string", required: false }
          - { label: "Knap 2 – link", name: "knap2_link", widget: "string", required: false }
          - { label: "Boks til højre – overskrift", name: "boks_overskrift", widget: "string" }
          - label: "Boks til højre – punkter"
            name: "boks_punkter"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Ikon", name: "ikon", widget: "select", options: ["book", "heart", "voice", "users", "tools", "chat", "star", "lock", "file", "mail", "cal", "clock", "pin", "video"] }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "string" }
          - { label: "Søjler – lille overskrift", name: "soejler_eyebrow", widget: "string" }
          - { label: "Søjler – overskrift", name: "soejler_overskrift", widget: "string" }
          - label: "Søjler"
            name: "soejler"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Ikon", name: "ikon", widget: "select", options: ["book", "heart", "voice", "users", "tools", "chat", "star", "lock", "file", "mail", "cal", "clock", "pin", "video"] }
              - { label: "Farve", name: "farve", widget: "select", options: [{ label: "Petrol", value: "petrol" }, { label: "Terracotta", value: "terra" }], default: "petrol" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
          - label: "Mørk boks"
            name: "panel"
            widget: "object"
            fields:
              - { label: "Vis boksen", name: "vis", widget: "boolean", default: true }
              - { label: "Lille overskrift", name: "eyebrow", widget: "string" }
              - { label: "Overskrift", name: "overskrift", widget: "string" }
              - { label: "Tekst til venstre", name: "tekst_venstre", widget: "text" }
              - { label: "Tekst til højre", name: "tekst_hoejre", widget: "text" }
              - { label: "Knap – tekst", name: "knap_tekst", widget: "string", required: false }
              - { label: "Knap – link", name: "knap_link", widget: "string", required: false }
          - { label: "Vis de nyeste nyheder", name: "vis_nyheder", widget: "boolean", default: true }
          - { label: "Overskrift over nyheder", name: "nyheder_overskrift", widget: "string" }
          - label: "Medlemskab nederst"
            name: "medlem"
            widget: "object"
            fields:
              - { label: "Lille overskrift", name: "eyebrow", widget: "string" }
              - { label: "Overskrift", name: "overskrift", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
              - { label: "Knap 1 – tekst", name: "knap1_tekst", widget: "string" }
              - { label: "Knap 1 – link", name: "knap1_link", widget: "string" }
              - { label: "Knap 2 – tekst (åbner mail)", name: "knap2_tekst", widget: "string" }

      - label: "Ekstraordinær generalforsamling"
        name: "ekstraordinaer"
        file: "src/_data/ekstraordinaer.json"
        fields:
          - { label: "Lille overskrift", name: "eyebrow", widget: "string" }
          - { label: "Overskrift", name: "overskrift", widget: "string" }
          - { label: "Indledning", name: "intro", widget: "text" }
          - { label: "Dato", name: "dato", widget: "string" }
          - { label: "Tidspunkt", name: "tid", widget: "string" }
          - { label: "Sted", name: "sted", widget: "string" }
          - { label: "Køreplan – overskrift", name: "koreplan_overskrift", widget: "string" }
          - label: "Køreplan"
            name: "koreplan"
            widget: "list"
            summary: "{{fields.dato}} – {{fields.status}}"
            fields:
              - { label: "Hvornår", name: "dato", widget: "string" }
              - { label: "Hvad", name: "tekst", widget: "text" }
              - { label: "Status", name: "status", widget: "select", options: [{ label: "Gennemført", value: "faerdig" }, { label: "Nu", value: "nu" }, { label: "Kommende", value: "kommende" }], default: "kommende" }
          - label: "Høring"
            name: "hoering"
            widget: "object"
            fields:
              - { label: "Høringen er åben (viser formularen)", name: "aaben", widget: "boolean", default: true }
              - { label: "Overskrift", name: "overskrift", widget: "string" }
              - { label: "Høringsfrist", name: "frist", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
              - label: "Dokumenter til høringen"
                name: "dokumenter"
                widget: "list"
                summary: "{{fields.titel}}"
                fields:
                  - { label: "Titel", name: "titel", widget: "string" }
                  - { label: "PDF eller link", name: "fil", widget: "file", required: false, hint: "Upload en PDF – eller skriv en adresse på siden, fx /referat-stiftende-generalforsamling" }
                  - { label: "Tekst, hvis der ikke er fil endnu", name: "status", widget: "string", required: false }
              - { label: "Tekst, når høringen er lukket", name: "lukket_tekst", widget: "text" }
          - label: "Tilmelding"
            name: "tilmelding"
            widget: "object"
            fields:
              - { label: "Tilmeldingen er åben (viser knappen)", name: "aaben", widget: "boolean", default: false }
              - { label: "Overskrift", name: "overskrift", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
              - { label: "Link til tilmeldingsformular", name: "link", widget: "string" }
              - { label: "Knaptekst", name: "knap_tekst", widget: "string" }
              - { label: "Tilmeldingsfrist", name: "frist", widget: "string" }
              - { label: "Tekst, når tilmeldingen ikke er åben", name: "lukket_tekst", widget: "text" }
          - { label: "Online-deltagelse – overskrift", name: "digital_overskrift", widget: "string" }
          - { label: "Online-deltagelse – punkter", name: "digital", widget: "list", field: { label: "Punkt", name: "punkt", widget: "text" } }
          - { label: "Regler – overskrift", name: "regler_overskrift", widget: "string" }
          - { label: "Regler – punkter", name: "regler", widget: "list", field: { label: "Punkt", name: "punkt", widget: "text" } }

      - label: "Om RCA"
        name: "om"
        file: "src/_data/om.json"
        fields:
          - { label: "Lille overskrift", name: "eyebrow", widget: "string" }
          - { label: "Overskrift", name: "overskrift", widget: "string" }
          - { label: "Indledning", name: "intro", widget: "text" }
          - { label: "Fokusområder – lille overskrift", name: "fokus_eyebrow", widget: "string" }
          - { label: "Fokusområder – overskrift", name: "fokus_overskrift", widget: "string" }
          - label: "Fokusområder"
            name: "fokus"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Ikon", name: "ikon", widget: "select", options: ["book", "heart", "voice", "users", "tools", "chat", "star", "lock", "file", "mail", "cal", "clock", "pin", "video"] }
              - { label: "Farve", name: "farve", widget: "select", options: [{ label: "Petrol", value: "petrol" }, { label: "Terracotta", value: "terra" }], default: "petrol" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
          - { label: "Værdier – lille overskrift", name: "vaerdier_eyebrow", widget: "string" }
          - { label: "Værdier – overskrift", name: "vaerdier_overskrift", widget: "string" }
          - { label: "Værdier – indledning", name: "vaerdier_intro", widget: "text" }
          - label: "Værdier"
            name: "vaerdier"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
          - { label: "Organisering – lille overskrift", name: "org_eyebrow", widget: "string" }
          - { label: "Organisering – overskrift", name: "org_overskrift", widget: "string" }
          - label: "Organisering"
            name: "org"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Ikon", name: "ikon", widget: "select", options: ["book", "heart", "voice", "users", "tools", "chat", "star", "lock", "file", "mail", "cal", "clock", "pin", "video"] }
              - { label: "Farve", name: "farve", widget: "select", options: [{ label: "Petrol", value: "petrol" }, { label: "Terracotta", value: "terra" }], default: "petrol" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
          - { label: "Bestyrelsen – lille overskrift", name: "bestyrelse_eyebrow", widget: "string", required: false }
          - { label: "Bestyrelsen – overskrift", name: "bestyrelse_overskrift", widget: "string", required: false }
          - { label: "Bestyrelsen – intro", name: "bestyrelse_intro", widget: "text", required: false }
          - label: "Bestyrelsesmedlemmer"
            name: "bestyrelse"
            widget: "list"
            required: false
            summary: "{{fields.navn}} – {{fields.post}}"
            fields:
              - { label: "Navn", name: "navn", widget: "string" }
              - { label: "Post", name: "post", widget: "string" }
              - { label: "Mail", name: "email", widget: "string", required: false }
          - { label: "Revisor", name: "revisor", widget: "string", required: false }
          - { label: "Link nederst – tekst", name: "link_tekst", widget: "string", required: false }
          - { label: "Link nederst – adresse", name: "link", widget: "string", required: false }

      - label: "Bliv medlem"
        name: "medlemskab"
        file: "src/_data/medlemskab.json"
        fields:
          - { label: "Lille overskrift", name: "eyebrow", widget: "string" }
          - { label: "Overskrift", name: "overskrift", widget: "string" }
          - { label: "Indledning", name: "intro", widget: "text" }
          - label: "Medlemstyper"
            name: "typer"
            widget: "list"
            summary: "{{fields.navn}} – {{fields.pris}}"
            fields:
              - { label: "Navn", name: "navn", widget: "string" }
              - { label: "Pris", name: "pris", widget: "string", hint: "Fx 0 kr. eller 250 kr." }
              - { label: "Periode", name: "periode", widget: "string", hint: "Fx pr. år" }
              - { label: "Beskrivelse", name: "tekst", widget: "text" }
              - { label: "Tekst om stemmeret", name: "stemmeret", widget: "string" }
              - { label: "Har stemmeret", name: "har_stemmeret", widget: "boolean", default: true }
              - { label: "Støttemedlemskab (prisen vises i terracotta)", name: "stoette", widget: "boolean", default: false }
          - { label: "Note under medlemstyperne", name: "note", widget: "text", required: false }
          - { label: "Sådan gør du – lille overskrift", name: "saadan_eyebrow", widget: "string" }
          - { label: "Sådan gør du – overskrift", name: "saadan_overskrift", widget: "string" }
          - { label: "Sådan gør du – tekst", name: "saadan_tekst", widget: "text" }
          - { label: "Sådan gør du – knaptekst", name: "saadan_knap", widget: "string", required: false }
          - { label: "Sådan gør du – knaplink", name: "saadan_link", widget: "string", required: false }
          - { label: "Godt at vide – overskrift", name: "godt_overskrift", widget: "string" }
          - { label: "Godt at vide – punkter", name: "godt_at_vide", widget: "list", field: { label: "Punkt", name: "punkt", widget: "text" } }

      - label: "Dokumenter"
        name: "dokumenter"
        file: "src/_data/dokumenter.json"
        fields:
          - { label: "Lille overskrift", name: "eyebrow", widget: "string" }
          - { label: "Overskrift", name: "overskrift", widget: "string" }
          - { label: "Indledning", name: "intro", widget: "text" }
          - label: "Dokumenter"
            name: "dokumenter"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Beskrivelse", name: "beskrivelse", widget: "text" }
              - { label: "PDF-fil", name: "fil", widget: "file", required: false, hint: "Upload en PDF eller vælg en, der allerede ligger på siden" }
              - { label: "Link til side på hjemmesiden", name: "side", widget: "string", required: false, hint: "Fx /referat-stiftende-generalforsamling" }
              - { label: "Tekst, hvis der hverken er fil eller link", name: "status", widget: "string", required: false, default: "Kommer snart" }
              - { label: "Fremhæv med terracotta-ikon", name: "fremhaev", widget: "boolean", default: false }
          - { label: "Note nederst", name: "note", widget: "text", required: false }

      - label: "Viden"
        name: "viden"
        file: "src/_data/viden.json"
        fields:
          - { label: "Lille overskrift", name: "eyebrow", widget: "string" }
          - { label: "Overskrift", name: "overskrift", widget: "string" }
          - { label: "Indledning", name: "intro", widget: "text" }
          - { label: "Guides – overskrift", name: "guides_overskrift", widget: "string", required: false }
          - label: "Guides"
            name: "guides"
            widget: "list"
            required: false
            summary: "{{fields.titel}}"
            fields:
              - { label: "Ikon", name: "ikon", widget: "select", options: ["book", "heart", "voice", "users", "tools", "chat", "star", "lock", "file", "mail", "cal", "clock", "pin", "video"] }
              - { label: "Farve", name: "farve", widget: "select", options: [{ label: "Petrol", value: "petrol" }, { label: "Terracotta", value: "terra" }], default: "petrol" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Kort tekst", name: "tekst", widget: "text" }
              - { label: "Link", name: "link", widget: "string", hint: "Fx /viden/dine-rettigheder/" }
          - label: "Temaer"
            name: "temaer"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Id (bruges i adressen, fx psykisk-helbred)", name: "id", widget: "string" }
              - { label: "Ikon", name: "ikon", widget: "select", options: ["book", "heart", "voice", "users", "tools", "chat", "star", "lock", "file", "mail", "cal", "clock", "pin", "video"] }
              - { label: "Farve", name: "farve", widget: "select", options: [{ label: "Petrol", value: "petrol" }, { label: "Terracotta", value: "terra" }], default: "petrol" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Kort beskrivelse (vises i oversigten)", name: "kort", widget: "text" }
              - { label: "Temaet er klar (ellers vises 'Kommer snart')", name: "klar", widget: "boolean", default: false }
              - { label: "Vidensstatus", name: "status", widget: "select", required: false, default: "udkast", options: [{ label: "Udkast – ikke fagligt gennemgået", value: "udkast" }, { label: "Fagligt gennemgået", value: "gennemgaaet" }, { label: "Opdateret efter review", value: "opdateret" }] }
              - { label: "Gennemgået af (navn og rolle)", name: "reviewer", widget: "string", required: false }
              - { label: "Dato for review", name: "review_dato", widget: "string", required: false }
              - { label: "Indledning", name: "intro", widget: "text", required: false }
              - { label: "Det vigtigste – punkter", name: "pointer", widget: "list", required: false, field: { label: "Punkt", name: "punkt", widget: "text" } }
              - label: "Grupper af kilder"
                name: "grupper"
                widget: "list"
                required: false
                summary: "{{fields.titel}}"
                fields:
                  - { label: "Overskrift", name: "titel", widget: "string" }
                  - label: "Kilder"
                    name: "kilder"
                    widget: "list"
                    summary: "{{fields.aar}} – {{fields.titel}}"
                    fields:
                      - { label: "Kildetype", name: "type", widget: "select", required: false, options: ["Metaanalyse", "Forskningsoversigt", "Registerstudie", "Forskningsrapport", "Forskningsartikel", "Ph.d.-afhandling", "Spørgeskemaundersøgelse", "Spørgeskemaundersøgelse (over tid)", "Interviewstudie", "Interview- og observationsstudie", "Officiel granskning", "Myndighedsrapport", "Igangværende undersøgelse", "Anbefaling fra myndighed", "Politisk aftale", "Officiel vejledning", "Presse", "Presse (praktisk guide)", "Organisation"] }
                      - { label: "Titel", name: "titel", widget: "string" }
                      - { label: "Forfattere", name: "forfattere", widget: "string" }
                      - { label: "År", name: "aar", widget: "string" }
                      - { label: "Udgiver / tidsskrift", name: "udgiver", widget: "string" }
                      - { label: "Link til kilden", name: "link", widget: "string", required: false }
                      - { label: "Resumé (med egne ord)", name: "resume", widget: "text" }
              - { label: "Fremhævet guide – tekst", name: "guide_tekst", widget: "string", required: false }
              - { label: "Fremhævet guide – link", name: "guide_link", widget: "string", required: false, hint: "Fx /viden/soegeguide-sydkorea/" }
              - { label: "Støttetekst nederst i temaet", name: "stoette", widget: "text", required: false }
          - { label: "Note nederst", name: "note", widget: "text", required: false }

      - label: "Viden: ændringslog"
        name: "aendringslog"
        file: "src/_data/aendringslog.json"
        fields:
          - label: "Poster (nyeste øverst)"
            name: "poster"
            widget: "list"
            summary: "{{fields.dato}} – {{fields.side}}"
            fields:
              - { label: "Dato", name: "dato", widget: "datetime", format: "YYYY-MM-DD", date_format: "D. MMMM YYYY", time_format: false, picker_utc: true }
              - { label: "Side", name: "side", widget: "string" }
              - { label: "Hvad er ændret?", name: "tekst", widget: "text" }

      - label: "Kontakt"
        name: "kontakt"
        file: "src/_data/kontakt.json"
        fields:
          - { label: "Lille overskrift", name: "eyebrow", widget: "string" }
          - { label: "Overskrift", name: "overskrift", widget: "string" }
          - { label: "Indledning", name: "intro", widget: "text" }
          - label: "Kontaktkort"
            name: "kort"
            widget: "list"
            summary: "{{fields.overskrift}}"
            fields:
              - { label: "Ikon", name: "ikon", widget: "select", options: ["book", "heart", "voice", "users", "tools", "chat", "star", "lock", "file", "mail", "cal", "clock", "pin", "video"] }
              - { label: "Farve", name: "farve", widget: "select", options: [{ label: "Petrol", value: "petrol" }, { label: "Terracotta", value: "terra" }], default: "petrol" }
              - { label: "Overskrift", name: "overskrift", widget: "string" }
              - { label: "E-mail", name: "email", widget: "string", required: false }
              - { label: "Tekst", name: "tekst", widget: "text", required: false }
              - { label: "Knaptekst (åbner mail)", name: "knap_tekst", widget: "string", required: false }

      - label: "Fælles: menu, sidefod og kontaktmail"
        name: "site"
        file: "src/_data/site.json"
        fields:
          - { label: "Foreningens navn", name: "navn", widget: "string" }
          - { label: "Kort navn (logo)", name: "kort_navn", widget: "string" }
          - { label: "Undertitel ved logo", name: "undertitel", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Tekst i sidefoden", name: "footer_tekst", widget: "text" }
          - { label: "Kontaktmail", name: "email", widget: "string" }
          - { label: "LinkedIn-side", name: "linkedin", widget: "string", required: false }
          - { label: "Facebook-gruppe", name: "facebook", widget: "string", required: false }
          - { label: "Knap øverst til højre – tekst", name: "knap_tekst", widget: "string", required: false }
